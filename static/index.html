<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Dictation</title>
<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#667085;
  --line:#d7dce5;
  --primary:#2563eb;
  --ok:#15803d;
  --bad:#b42318;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
.wrap{max-width:1080px;margin:0 auto;padding:22px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.topbar a{
  text-decoration:none;border-radius:10px;padding:9px 12px;
  background:#e8efff;color:#1749b3;font-weight:700;white-space:nowrap;
}
.learner-select{width:auto;min-width:125px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.small-button{padding:8px 10px;font-size:13px}
h1{font-size:28px;margin:0 0 6px}
.sub{color:var(--muted);margin-bottom:18px}
.card{
  background:var(--card);
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 5px 18px rgba(0,0,0,.04);
}
.url-row{display:flex;gap:10px}
.url-row input{flex:1}
input,textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  font-size:16px;
  color:var(--text);
  background:#fff;
}
textarea{
  min-height:136px;
  resize:vertical;
  line-height:1.55;
}
button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-size:15px;
  font-weight:650;
  cursor:pointer;
  background:#e5e7eb;
  color:#111827;
}
button.primary{background:var(--primary);color:white}
button.good{background:#dcfce7;color:#166534}
button.warn{background:#fef3c7;color:#92400e}
.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:16px}
@media(max-width:850px){
  .grid{grid-template-columns:1fr}
  .url-row{flex-direction:column}
}
#player{
  width:100%;
  aspect-ratio:16/9;
  background:#111;
  border-radius:12px;
  overflow:hidden;
}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.meta{font-size:14px;color:var(--muted)}
.progress{
  height:8px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
  margin:10px 0 14px;
}
.bar{height:100%;width:0;background:var(--primary)}
.sentence{
  min-height:92px;
  border:1px dashed #cbd5e1;
  border-radius:12px;
  padding:14px;
  font-size:20px;
  line-height:1.55;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#f8fafc;
}
.hidden-text{
  filter:blur(7px);
  user-select:none;
  pointer-events:none;
}
.sentence-text{display:inline;white-space:normal}
.word-token{
  display:inline;
  padding:0;
  border:0;
  border-radius:4px;
  background:transparent;
  color:inherit;
  font:inherit;
  font-weight:inherit;
  cursor:pointer;
}
.word-token:hover{
  background:#dbeafe;
  color:#1d4ed8;
}
.word-card{
  display:none;
  margin-top:12px;
  padding:12px 14px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  background:#fff;
}
.word-card.visible{display:block}
.word-card-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}
.word-card-title{font-size:20px;font-weight:750}
.word-card-meaning{font-size:18px;margin-top:5px}
.word-card-meta{font-size:12px;color:var(--muted);margin-top:5px}
.word-card button{white-space:nowrap}
.status{margin-top:10px;font-size:14px;color:var(--muted)}
.error{color:var(--bad);white-space:pre-wrap}
.feedback{margin-top:10px;min-height:24px;font-size:15px}
.ok{color:var(--ok);font-weight:700}
.bad{color:var(--bad);font-weight:700}
.badge{
  display:inline-block;
  padding:3px 8px;
  margin-left:6px;
  border-radius:999px;
  background:#eef2ff;
  color:#3730a3;
  font-size:12px;
}
.help{font-size:14px;line-height:1.9;color:#475467}
.kbd{
  display:inline-block;
  padding:1px 6px;
  border:1px solid #cbd5e1;
  border-bottom-width:2px;
  border-radius:5px;
  background:white;
  font-size:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.answer-label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:16px 0 8px;
  font-weight:650;
}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.translation-box{
  display:none;
  margin-top:12px;
  padding:12px 14px;
  border:1px solid #dbe3f0;
  border-radius:10px;
  background:#f8fafc;
  line-height:1.6;
  font-size:16px;
}
.translation-box.visible{display:block}
.translation-meta{display:block;margin-top:5px;color:var(--muted);font-size:12px}
.corrected-word{font-weight:700;color:var(--primary)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>Media Dictation</h1>
      <div class="sub">粘贴 YouTube 或 YouTube Music Podcast 链接，逐句听写。原文默认隐藏。</div>
    </div>
    <div class="top-actions">
      <select id="learnerSelect" class="learner-select" title="当前学习者"></select>
      <button id="addLearner" class="small-button">+ 学习者</button>
      <a href="/review">错句复习</a>
      <a href="/learning">学习中心</a>
    </div>
  </div>

  <div class="card">
    <div class="url-row">
      <input id="url" type="text" placeholder="YouTube / YouTube Music Podcast 链接" autocomplete="off">
      <button id="load" class="primary">获取字幕并开始</button>
    </div>
    <div id="status" class="status">输入链接后开始。字幕载入后，单按 Ctrl 重播当前句。</div>
  </div>

  <div class="grid">
    <div class="card">
      <div id="player"></div>
    </div>

    <div class="card">
      <div class="meta">
        <span id="pos">0 / 0</span>
        ·
        <span id="range">00:00</span>
        <span id="lang"></span>
        · <span id="videoTitle"></span>
      </div>

      <div class="progress"><div id="bar" class="bar"></div></div>

      <div id="sentence" class="sentence hidden-text">请先粘贴 YouTube 链接</div>

      <div id="wordCard" class="word-card">
        <div class="word-card-head">
          <div>
            <div id="wordTitle" class="word-card-title"></div>
            <div id="wordMeaning" class="word-card-meaning"></div>
            <div id="wordMeta" class="word-card-meta"></div>
          </div>
          <button id="addVocab" class="good" disabled>加入生词本</button>
        </div>
        <div id="wordStatus" class="status"></div>
      </div>

      <div class="row" style="margin-top:12px">
        <button id="play" class="primary">▶ 重播当前句</button>
        <button id="prev">← 上一句</button>
        <button id="next">下一句 →</button>
        <button id="show" class="warn">显示/隐藏原文</button>
        <button id="translate">中文翻译</button>
      </div>

      <div id="translation" class="translation-box"></div>

      <div class="answer-label">
        <span>你的听写</span>
        <span class="hint">Enter 检查</span>
      </div>

      <textarea
        id="answer"
        placeholder="输入你听到的英文…"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      ></textarea>

      <div class="row" style="margin-top:10px">
        <button id="check" class="good">Check</button>
        <button id="clear">清空</button>
      </div>

      <div id="feedback" class="feedback"></div>
    </div>
  </div>

  <div class="card help">
    <strong>快捷键：</strong>
    <span class="kbd">Ctrl</span> 单独按下并松开：重播当前句；
    <span class="kbd">Enter</span>：检查答案；
    每次只修正第一个错误词/漏词/多余词，其余输入保持不变；整句正确后停在当前句；
    <span class="kbd">Ctrl</span> + <span class="kbd">H</span>：显示/隐藏原文；
    <span class="kbd">Tab</span> / <span class="kbd">Shift</span> + <span class="kbd">Tab</span>：下一句/上一句。
  </div>
</div>

<script>
let player = null;
let playerReady = false;
let items = [];
let index = 0;
let reveal = false;
let videoId = "";
let videoTitle = "";
let segmentationVersion = "";
let sessionId = null;
let activeLearnerId = null;
let sentenceStartedAt = Date.now();
let stopTimer = null;
const translationCache = new Map();
const wordLookupCache = new Map();
let activeWordLookup = null;

let ctrlDown = false;
let ctrlUsedAsChord = false;

async function loadLearners(preferredId) {
  const response = await fetch("/api/learners");
  const data = await response.json();
  if (!response.ok || !data.ok) {
    throw new Error(data.error || "无法读取学习者。");
  }

  const select = document.getElementById("learnerSelect");
  select.textContent = "";

  const stored = Number(localStorage.getItem("mediaDictationLearnerId") || 0);
  const target = Number(preferredId || stored || data.default_learner_id || 0);

  (data.learners || []).forEach(function (learner) {
    const option = document.createElement("option");
    option.value = String(learner.id);
    option.textContent = learner.name;
    select.appendChild(option);
  });

  const ids = (data.learners || []).map(function (x) { return Number(x.id); });
  activeLearnerId = ids.includes(target)
    ? target
    : Number(data.default_learner_id || ids[0] || 0);

  select.value = String(activeLearnerId);
  localStorage.setItem("mediaDictationLearnerId", String(activeLearnerId));
}

async function addLearner() {
  const name = window.prompt("新学习者名称：");
  if (!name || !name.trim()) return;

  const response = await fetch("/api/learners", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name: name.trim()})
  });
  const data = await response.json();
  if (!response.ok || !data.ok) {
    window.alert(data.error || "创建学习者失败。");
    return;
  }
  await loadLearners(data.learner.id);
}

function logPracticeEvent(eventType, valueMs, detail) {
  if (!sessionId) return Promise.resolve();
  return fetch("/api/event", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    keepalive: true,
    body: JSON.stringify({
      session_id: sessionId,
      sentence_index: items.length ? index : null,
      event_type: eventType,
      value_ms: Number(valueMs || 0),
      detail: detail || ""
    })
  }).catch(function (error) {
    console.warn("Practice event logging failed:", error);
  });
}

function flushSentenceTime() {
  if (!sessionId || !items.length) {
    sentenceStartedAt = Date.now();
    return;
  }
  const elapsed = Date.now() - sentenceStartedAt;
  sentenceStartedAt = Date.now();
  if (elapsed >= 500) {
    void logPracticeEvent("time_spent", elapsed, "");
  }
}

function formatTime(seconds) {
  seconds = Math.max(0, Math.floor(seconds || 0));
  const minutes = Math.floor(seconds / 60);
  const rest = seconds % 60;
  return String(minutes).padStart(2, "0") + ":" + String(rest).padStart(2, "0");
}

function updateUI() {
  if (!items.length) {
    document.getElementById("pos").textContent = "0 / 0";
    return;
  }

  const item = items[index];
  document.getElementById("pos").textContent = String(index + 1) + " / " + String(items.length);
  document.getElementById("range").textContent =
    formatTime(item.start) + "–" + formatTime(item.end || (item.start + item.duration));
  document.getElementById("videoTitle").textContent = videoTitle || videoId;

  const sentence = document.getElementById("sentence");
  renderInteractiveSentence(item.text);
  sentence.classList.toggle("hidden-text", !reveal);

  document.getElementById("bar").style.width =
    (((index + 1) / items.length) * 100).toFixed(2) + "%";
}

function renderInteractiveSentence(text) {
  const sentence = document.getElementById("sentence");
  sentence.textContent = "";

  const container = document.createElement("span");
  container.className = "sentence-text";

  const regex = /[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu;
  let lastIndex = 0;
  let match;

  while ((match = regex.exec(text)) !== null) {
    if (match.index > lastIndex) {
      container.appendChild(
        document.createTextNode(text.slice(lastIndex, match.index))
      );
    }

    const clickedWord = match[0];
    const wordButton = document.createElement("button");
    wordButton.type = "button";
    wordButton.className = "word-token";
    wordButton.textContent = clickedWord;
    wordButton.title = "点击查看中文释义";
    wordButton.addEventListener("click", function (event) {
      event.stopPropagation();
      void lookupWord(clickedWord);
    });

    container.appendChild(wordButton);
    lastIndex = match.index + match[0].length;
  }

  if (lastIndex < text.length) {
    container.appendChild(document.createTextNode(text.slice(lastIndex)));
  }

  sentence.appendChild(container);
}

function hideWordCard() {
  activeWordLookup = null;
  const card = document.getElementById("wordCard");
  card.classList.remove("visible");
  document.getElementById("wordTitle").textContent = "";
  document.getElementById("wordMeaning").textContent = "";
  document.getElementById("wordMeta").textContent = "";
  document.getElementById("wordStatus").textContent = "";
  document.getElementById("addVocab").disabled = true;
}

function renderWordLookup(data) {
  activeWordLookup = data;

  document.getElementById("wordTitle").textContent = data.word;
  document.getElementById("wordMeaning").textContent = data.translation;
  document.getElementById("wordMeta").textContent =
    (data.cached ? "已缓存 · " : "") +
    (data.model || "") +
    (data.service_tier ? " · " + data.service_tier : "");
  document.getElementById("wordStatus").textContent = "";
  document.getElementById("addVocab").disabled = false;
  document.getElementById("wordCard").classList.add("visible");
}

async function lookupWord(word) {
  if (!items.length || !reveal) {
    return;
  }

  void logPracticeEvent("word_lookup", 0, word);
  const context = items[index].text;
  const cacheKey = word.toLowerCase() + "\n" + context;
  const card = document.getElementById("wordCard");

  card.classList.add("visible");
  document.getElementById("wordTitle").textContent = word;
  document.getElementById("wordMeaning").textContent = "正在查询…";
  document.getElementById("wordMeta").textContent = "";
  document.getElementById("wordStatus").textContent = "";
  document.getElementById("addVocab").disabled = true;

  if (wordLookupCache.has(cacheKey)) {
    renderWordLookup(wordLookupCache.get(cacheKey));
    return;
  }

  const controller = new AbortController();
  const timeoutId = window.setTimeout(function () {
    controller.abort();
  }, 50000);

  try {
    const response = await fetch("/api/word-lookup", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        word: word,
        context: context
      }),
      signal: controller.signal
    });

    const data = await response.json();
    if (!response.ok || !data.ok) {
      throw new Error(data.error || "单词查询失败。");
    }

    const lookup = {
      word: word,
      normalized_word: data.normalized_word,
      translation: data.translation,
      model: data.model,
      service_tier: data.service_tier,
      cached: Boolean(data.cached),
      context: context
    };

    wordLookupCache.set(cacheKey, lookup);
    renderWordLookup(lookup);
  } catch (error) {
    activeWordLookup = null;
    document.getElementById("wordMeaning").textContent = "";
    document.getElementById("wordMeta").textContent = "";
    document.getElementById("addVocab").disabled = true;

    document.getElementById("wordStatus").textContent =
      error && error.name === "AbortError"
        ? "单词查询超过 50 秒仍未完成。请检查本地 Ollama 是否运行、模型是否可用，或检查 OpenAI fallback 配置。"
        : String(error.message || error);
  } finally {
    window.clearTimeout(timeoutId);
  }
}

async function addActiveWordToVocabulary() {
  if (!activeWordLookup) {
    return;
  }

  const button = document.getElementById("addVocab");
  const status = document.getElementById("wordStatus");
  button.disabled = true;
  button.textContent = "保存中…";
  status.textContent = "";

  try {
    const response = await fetch("/api/vocabulary", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        word: activeWordLookup.word,
        translation: activeWordLookup.translation,
        context: activeWordLookup.context,
        video_id: videoId,
        source_url: document.getElementById("url").value.trim(),
        learner_id: activeLearnerId,
        session_id: sessionId,
        sentence_index: index
      })
    });

    const data = await response.json();
    if (!response.ok || !data.ok) {
      throw new Error(data.error || "加入生词本失败。");
    }

    status.textContent = "✓ 已加入生词本";
    button.textContent = "已加入";
  } catch (error) {
    status.textContent = String(error.message || error);
    button.disabled = false;
    button.textContent = "加入生词本";
  }
}

function focusAnswer() {
  const answer = document.getElementById("answer");
  requestAnimationFrame(function () {
    answer.focus();
  });
}

function resetForSentence() {
  sentenceStartedAt = Date.now();
  document.getElementById("answer").value = "";
  document.getElementById("feedback").innerHTML = "";
  const translation = document.getElementById("translation");
  translation.textContent = "";
  translation.classList.remove("visible");
  hideWordCard();
  reveal = false;
  updateUI();
  focusAnswer();
}

function playCurrent() {
  if (!playerReady || !items.length) {
    return;
  }

  void logPracticeEvent("play", 0, "");
  clearInterval(stopTimer);

  const item = items[index];
  const end = item.end || (item.start + Math.max(item.duration || 0, 0.25));

  player.seekTo(item.start, true);
  player.playVideo();

  stopTimer = setInterval(function () {
    const current = player.getCurrentTime();
    if (current >= end - 0.04) {
      player.pauseVideo();
      clearInterval(stopTimer);
    }
  }, 40);
}

function moveSentence(delta, autoplay) {
  if (!items.length) {
    return;
  }

  const nextIndex = Math.max(0, Math.min(items.length - 1, index + delta));
  if (nextIndex === index && delta !== 0) {
    return;
  }

  flushSentenceTime();
  void logPracticeEvent(delta > 0 ? "next" : "prev", 0, "");
  index = nextIndex;
  resetForSentence();

  if (autoplay) {
    window.setTimeout(playCurrent, 80);
  }
}

function toggleOriginal() {
  if (!items.length) {
    return;
  }
  reveal = !reveal;
  if (reveal) {
    void logPracticeEvent("reveal", 0, "");
  }
  if (!reveal) {
    hideWordCard();
  }
  updateUI();
}

function tokenizeWithOffsets(text) {
  const tokens = [];
  const regex = /[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu;
  let match;

  while ((match = regex.exec(text)) !== null) {
    const raw = match[0];
    const value = raw
      .normalize("NFKC")
      .toLowerCase()
      .replace(/[^\p{L}\p{N}]+/gu, "");

    if (!value) continue;

    tokens.push({
      raw: raw,
      value: value,
      start: match.index,
      end: match.index + raw.length
    });
  }

  return tokens;
}

function firstEdit(answerText, expectedText) {
  const actual = tokenizeWithOffsets(answerText);
  const expected = tokenizeWithOffsets(expectedText);
  const m = actual.length;
  const n = expected.length;

  const dp = Array.from({length:m + 1}, function () {
    return Array(n + 1).fill(0);
  });

  for (let i = m; i >= 0; i -= 1) {
    for (let j = n; j >= 0; j -= 1) {
      if (i === m && j === n) {
        dp[i][j] = 0;
      } else if (i === m) {
        dp[i][j] = n - j;
      } else if (j === n) {
        dp[i][j] = m - i;
      } else if (actual[i].value === expected[j].value) {
        dp[i][j] = dp[i + 1][j + 1];
      } else {
        dp[i][j] = 1 + Math.min(
          dp[i + 1][j + 1],
          dp[i][j + 1],
          dp[i + 1][j]
        );
      }
    }
  }

  let i = 0;
  let j = 0;

  while (
    i < m &&
    j < n &&
    actual[i].value === expected[j].value
  ) {
    i += 1;
    j += 1;
  }

  if (i === m && j === n) {
    return null;
  }

  // Prefer an insertion/deletion when the following word makes the alignment
  // obvious. This prevents one missing word from making every later word look wrong.
  if (
    i < m &&
    j + 1 < n &&
    actual[i].value === expected[j + 1].value &&
    dp[i][j] === 1 + dp[i][j + 1]
  ) {
    return {
      type: "missing",
      actualIndex: i,
      expectedIndex: j,
      actual: actual[i] || null,
      expected: expected[j]
    };
  }

  if (
    i + 1 < m &&
    j < n &&
    actual[i + 1].value === expected[j].value &&
    dp[i][j] === 1 + dp[i + 1][j]
  ) {
    return {
      type: "extra",
      actualIndex: i,
      expectedIndex: j,
      actual: actual[i],
      expected: expected[j] || null
    };
  }

  if (
    i < m &&
    j < n &&
    dp[i][j] === 1 + dp[i + 1][j + 1]
  ) {
    return {
      type: "replace",
      actualIndex: i,
      expectedIndex: j,
      actual: actual[i],
      expected: expected[j]
    };
  }

  if (j < n && dp[i][j] === 1 + dp[i][j + 1]) {
    return {
      type: "missing",
      actualIndex: i,
      expectedIndex: j,
      actual: actual[i] || null,
      expected: expected[j]
    };
  }

  return {
    type: "extra",
    actualIndex: i,
    expectedIndex: j,
    actual: actual[i],
    expected: expected[j] || null
  };
}

function applyFirstCorrection(edit) {
  const answer = document.getElementById("answer");
  const text = answer.value;
  let nextText = text;
  let selectionStart = 0;
  let selectionEnd = 0;
  let message = "";

  if (edit.type === "replace") {
    const word = edit.expected.raw;
    nextText =
      text.slice(0, edit.actual.start) +
      word +
      text.slice(edit.actual.end);
    selectionStart = edit.actual.start;
    selectionEnd = selectionStart + word.length;
    message =
      '正确单词：<span class="corrected-word">' +
      word +
      "</span>";
  } else if (edit.type === "missing") {
    const word = edit.expected.raw;
    const position = edit.actual ? edit.actual.start : text.length;

    let inserted = word;
    let wordStart = position;

    if (position === 0) {
      if (text.length && !/^\s/.test(text)) {
        inserted += " ";
      }
    } else if (position === text.length) {
      if (!/\s$/.test(text)) {
        inserted = " " + inserted;
        wordStart += 1;
      }
    } else {
      const needsTrailingSpace = !/^\s/.test(text.slice(position));
      inserted += needsTrailingSpace ? " " : "";
    }

    nextText = text.slice(0, position) + inserted + text.slice(position);
    selectionStart = wordStart;
    selectionEnd = wordStart + word.length;
    message =
      '漏词，已补上：<span class="corrected-word">' +
      word +
      "</span>";
  } else {
    let start = edit.actual.start;
    let end = edit.actual.end;

    // Remove one adjacent separator with an extra word so the remaining
    // sentence stays readable without rewriting any other words.
    if (end < text.length && /\s/.test(text[end])) {
      end += 1;
    } else if (start > 0 && /\s/.test(text[start - 1])) {
      start -= 1;
    }

    const removed = edit.actual.raw;
    nextText = text.slice(0, start) + text.slice(end);
    selectionStart = start;
    selectionEnd = start;
    message =
      '多余单词已删除：<span class="corrected-word">' +
      removed +
      "</span>";
  }

  answer.value = nextText;
  answer.focus();
  answer.setSelectionRange(selectionStart, selectionEnd);
  document.getElementById("feedback").innerHTML = message;
}

async function logAttempt(eventType, answerBefore, edit) {
  if (!sessionId || !items.length) {
    return;
  }

  let wrongWord = null;
  let correctWord = null;

  if (edit) {
    if (edit.type === "replace") {
      wrongWord = edit.actual ? edit.actual.raw : null;
      correctWord = edit.expected ? edit.expected.raw : null;
    } else if (edit.type === "missing") {
      correctWord = edit.expected ? edit.expected.raw : null;
    } else if (edit.type === "extra") {
      wrongWord = edit.actual ? edit.actual.raw : null;
    }
  }

  try {
    await fetch("/api/attempt", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        session_id: sessionId,
        sentence_index: index,
        sentence_text: items[index].text,
        answer_before: answerBefore,
        event_type: eventType,
        wrong_word: wrongWord,
        correct_word: correctWord
      })
    });
  } catch (error) {
    console.warn("Practice logging failed:", error);
  }
}

function checkCurrent() {
  if (!items.length) {
    return;
  }

  const answer = document.getElementById("answer");
  const answerBefore = answer.value;
  const edit = firstEdit(
    answerBefore,
    items[index].text
  );

  if (edit) {
    void logAttempt(edit.type, answerBefore, edit);
    applyFirstCorrection(edit);
    return;
  }

  void logAttempt("correct", answerBefore, null);
  document.getElementById("feedback").innerHTML =
    '<span class="ok">✓ 全部正确</span>';
  focusAnswer();
}

function renderTranslation(translation, model, serviceTier) {
  const box = document.getElementById("translation");
  box.textContent = "";

  const textNode = document.createElement("span");
  textNode.textContent = translation;

  const meta = document.createElement("span");
  meta.className = "translation-meta";
  meta.textContent = model + (serviceTier ? " · " + serviceTier : "");

  box.appendChild(textNode);
  box.appendChild(meta);
  box.classList.add("visible");
}

async function translateCurrent() {
  if (!items.length) {
    return;
  }

  void logPracticeEvent("translation", 0, "");
  const box = document.getElementById("translation");
  const button = document.getElementById("translate");
  const source = items[index].text;

  if (translationCache.has(source)) {
    const cached = translationCache.get(source);
    renderTranslation(cached.translation, cached.model, cached.service_tier);
    return;
  }

  button.disabled = true;
  button.textContent = "翻译中…";
  box.textContent = "正在生成中文翻译…";
  box.classList.add("visible");

  const controller = new AbortController();
  const timeoutId = window.setTimeout(function () {
    controller.abort();
  }, 70000);

  try {
    const response = await fetch("/api/translate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: source}),
      signal: controller.signal
    });

    const contentType = response.headers.get("content-type") || "";
    const data = contentType.includes("application/json")
      ? await response.json()
      : {ok: false, error: await response.text()};

    if (!response.ok || !data.ok) {
      throw new Error(data.error || "翻译失败。");
    }

    translationCache.set(source, {
      translation: data.translation,
      model: data.model,
      service_tier: data.service_tier
    });

    renderTranslation(data.translation, data.model, data.service_tier);
  } catch (error) {
    if (error && error.name === "AbortError") {
      box.textContent =
        "翻译请求超过 70 秒仍未完成。请检查本地 Ollama 是否运行、模型是否可用，或检查 OpenAI fallback 配置。";
    } else {
      box.textContent = String(error.message || error);
    }
  } finally {
    window.clearTimeout(timeoutId);
    button.disabled = false;
    button.textContent = "中文翻译";
  }
}

async function startPracticeSession(sourceUrl, transcriptData) {
  sessionId = null;

  try {
    const response = await fetch("/api/session", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        video_id: transcriptData.video_id,
        source_url: sourceUrl,
        language: transcriptData.language || transcriptData.language_code || "",
        is_generated: Boolean(transcriptData.is_generated),
        total_items: (transcriptData.items || []).length,
        learner_id: activeLearnerId,
        video_title: transcriptData.video_title || "",
        segmentation_version: transcriptData.segmentation_version || "",
        items: transcriptData.items || []
      })
    });

    const data = await response.json();
    if (response.ok && data.ok) {
      sessionId = data.session_id;
      sentenceStartedAt = Date.now();
      void logPracticeEvent("session_open", 0, "new");
    } else {
      console.warn("Could not create practice session:", data.error || data);
    }
  } catch (error) {
    console.warn("Could not create practice session:", error);
  }
}

async function loadVideo(options) {
  options = options || {};
  const url = document.getElementById("url").value.trim();
  const status = document.getElementById("status");

  if (!url) {
    status.innerHTML = '<span class="error">请先输入 YouTube 链接。</span>';
    return;
  }

  status.textContent = "正在读取字幕…";

  try {
    const response = await fetch("/api/transcript?url=" + encodeURIComponent(url));
    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(data.error || "字幕读取失败。");
    }

    items = data.items || [];
    videoId = data.video_id;
    videoTitle = data.video_title || "";
    segmentationVersion = data.segmentation_version || "";
    index = Math.max(
      0,
      Math.min(
        items.length ? items.length - 1 : 0,
        Number(options.resumeIndex || 0)
      )
    );
    reveal = false;

    if (!items.length) {
      throw new Error("这个视频没有可用于听写的字幕。");
    }

    const generated = data.is_generated ? " · 自动字幕" : " · 人工字幕";
    document.getElementById("lang").innerHTML =
      '<span class="badge">' +
      (data.language || data.language_code || "字幕") +
      generated +
      "</span>";

    status.textContent =
      options.reuseSessionId
        ? "已恢复练习，第 " + String(index + 1) + " / " + String(items.length) + " 句。"
        : "已生成 " + String(items.length) + " 个听写句子。单按 Ctrl 开始/重播当前句。";

    if (options.reuseSessionId) {
      sessionId = Number(options.reuseSessionId);
      sentenceStartedAt = Date.now();
      void logPracticeEvent("session_open", 0, "resume_legacy");
    } else {
      await startPracticeSession(url, data);
    }
    resetForSentence();

    if (playerReady) {
      player.cueVideoById(videoId);
    }
  } catch (error) {
    status.innerHTML =
      '<span class="error">' + String(error.message || error) + "</span>";
  }
}

async function resumeFromQuery() {
  const params = new URLSearchParams(window.location.search);
  const resumeId = params.get("resume");

  if (!resumeId) {
    return;
  }

  const status = document.getElementById("status");
  status.textContent = "正在恢复上次练习…";

  try {
    const response = await fetch("/api/session/" + encodeURIComponent(resumeId));
    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(data.error || "无法读取练习记录。");
    }

    const session = data.session;
    document.getElementById("url").value = session.source_url;

    if (session.learner_id) {
      await loadLearners(session.learner_id);
    }

    if (session.items && session.items.length) {
      items = session.items;
      videoId = session.video_id;
      videoTitle = session.video_title || "";
      segmentationVersion = session.segmentation_version || "";
      sessionId = Number(session.id);
      index = Math.max(
        0,
        Math.min(items.length - 1, Number(session.resume_index || 0))
      );
      reveal = false;
      document.getElementById("lang").innerHTML =
        '<span class="badge">' + (session.language || "字幕") + '</span>';
      status.textContent =
        "已从保存的练习快照恢复，第 " +
        String(index + 1) + " / " + String(items.length) + " 句。";
      resetForSentence();
      void logPracticeEvent("session_open", 0, "resume_snapshot");
      if (playerReady) player.cueVideoById(videoId);
    } else {
      await loadVideo({
        reuseSessionId: session.id,
        resumeIndex: session.resume_index
      });
    }
  } catch (error) {
    status.innerHTML =
      '<span class="error">' + String(error.message || error) + "</span>";
  }
}

});

window.addEventListener(
  "keydown",
  function (event) {
    if (event.key === "Control") {
      if (!event.repeat) {
        ctrlDown = true;
        ctrlUsedAsChord = false;
      }
      return;
    }

    if (event.ctrlKey) {
      ctrlUsedAsChord = true;

      if (event.key.toLowerCase() === "h") {
        event.preventDefault();
        event.stopPropagation();
        toggleOriginal();
      }
      return;
    }

    const activeId = document.activeElement ? document.activeElement.id : "";

    if (event.key === "Enter" && activeId === "answer" && !event.shiftKey) {
      event.preventDefault();
      checkCurrent();
      return;
    }

    if (event.key === "Tab" && activeId === "answer") {
      event.preventDefault();
      moveSentence(event.shiftKey ? -1 : 1, true);
    }
  },
  true
);

window.addEventListener(
  "keyup",
  function (event) {
    if (event.key !== "Control") {
      return;
    }

    const shouldReplay = ctrlDown && !ctrlUsedAsChord;
    ctrlDown = false;
    ctrlUsedAsChord = false;

    if (shouldReplay) {
      event.preventDefault();
      playCurrent();
    }
  },
  true
);

async function bootstrap() {
  try {
    await loadLearners();
    await resumeFromQuery();
  } catch (error) {
    document.getElementById("status").innerHTML =
      '<span class="error">' + String(error.message || error) + "</span>";
  }
}

window.addEventListener("pagehide", function () {
  flushSentenceTime();
});

bootstrap();

};
